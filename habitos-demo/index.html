<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2E52">
<title>Racha Diaria</title>
<link rel="icon" href="logo-icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="fx"></canvas>
<main class="app">
  <header class="top">
    <div class="brand" aria-label="LUDO"><img class="brand-icon" src="logo-icono.png" alt=""><img class="brand-word" src="logo-texto.png" alt="LUDO"></div>
    <div class="stats">
      <div class="stat streak" id="streakChip" title="Racha de días completos">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5-1.5 5-1.5 7.5A2.5 2.5 0 0 0 13 12c1.6 0 2.5-1.3 2.3-3 2.4 1.7 3.7 4.3 3.7 7a7 7 0 0 1-14 0c0-4.6 4-7 7-14z"/></svg>
        <span id="streak">0</span>
      </div>
      <div class="stat xp" id="xpChip" title="Puntos de experiencia">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        <span id="xp">0</span>
      </div>
    </div>
  </header>
  <div class="day"><small id="dayLabel">Día 1</small><strong id="dateLabel">Hoy</strong></div>

  <section class="progress" aria-live="polite">
    <div class="progress-head"><span>Progreso de hoy</span><b id="pct">0/0</b></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="msg" id="msg"></div>
  </section>

  <ul class="list" id="list"></ul>

  <form class="add" id="addForm" autocomplete="off">
    <input id="newHabit" maxlength="40" placeholder="Nuevo hábito, p. ej. Estirar 10 min" aria-label="Nuevo hábito">
    <button class="btn" type="submit">Añadir</button>
  </form>
  <div class="hint" id="hint" hidden>Escribe un nombre para el hábito.</div>

  <button class="btn ghost" id="nextDay" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    Pasar al día siguiente
  </button>
  <p class="demo-note">Simulación para la demo: cierra el día y revisa qué quedó sin hacer.</p>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
